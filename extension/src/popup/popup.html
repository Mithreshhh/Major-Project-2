<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>On-Device Perception Agent</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0; --soft: #f8fafc; --soft2: #f1f5f9;
      --brand: #4f46e5; --brand2: #0891b2; --brand-soft: #eef2ff;
      --ok: #15803d; --ok-soft: #ecfdf3; --warn: #b45309; --warn-soft: #fffbeb; --bad: #dc2626; --bad-soft: #fef2f2;
      --face: #dc2626; --photo: #0e7490; --field: #7c3aed; --text: #b45309;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1120; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b; --soft: #111827; --soft2: #1e293b;
              --brand: #818cf8; --brand2: #22d3ee; --brand-soft: #1e1b4b;
              --ok: #4ade80; --ok-soft: #052e16; --warn: #fbbf24; --warn-soft: #291d05; --bad: #f87171; --bad-soft: #2a0e0e;
              --face: #f87171; --photo: #22d3ee; --field: #a78bfa; --text: #fbbf24; }
    }
    * { box-sizing: border-box; }
    body { width: 400px; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }

    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line);
             background: linear-gradient(120deg, var(--brand-soft), transparent 70%); }
    .mark { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
    .mark svg { width: 17px; height: 17px; }
    .title { flex: 1; min-width: 0; }
    .title h1 { font-size: 14px; margin: 0; line-height: 1.2; }
    .title .tag { font-size: 11px; color: var(--muted); }
    .server { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--bg); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
    .dot.bad { background: var(--bad); }

    .body { padding: 12px 14px 14px; }
    #page { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #page::before { content: "On: "; font-weight: 600; }

    textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px;
               background: var(--soft); color: var(--fg); font: inherit; font-size: 13.5px; transition: border-color .15s, box-shadow .15s; }
    textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
    #hint { color: var(--brand); font-size: 11.5px; min-height: 0; margin-top: 5px; }
    #hint:empty { display: none; }

    .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    button { font: inherit; font-weight: 600; padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft2); color: var(--fg); cursor: pointer; }
    button:hover:not(:disabled) { filter: brightness(1.05); border-color: var(--muted); }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.ghost { background: transparent; }
    button:disabled { opacity: .45; cursor: default; }
    .spacer { flex: 1; }
    .links { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; white-space: nowrap; }
    button.link { border: none; background: none; color: var(--brand); padding: 0; font-weight: 500; }
    button.link:hover { text-decoration: underline; filter: none; }

    .warn { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 7px 9px; font-size: 12px; margin-top: 8px; display: none; }
    .warn.show { display: block; }

    #status { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); border-left-width: 4px; display: none; }
    #status.show { display: block; }
    #status strong { display: block; font-size: 13.5px; }
    #status.running { border-left-color: var(--brand); }
    #status.running strong::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%;
      border: 2px solid var(--brand); border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.done { border-left-color: var(--ok); background: var(--ok-soft); } #status.done strong { color: var(--ok); }
    #status.answered { border-left-color: var(--brand); } #status.answered strong { color: var(--brand); }
    #status.failed { border-left-color: var(--bad); background: var(--bad-soft); } #status.failed strong { color: var(--bad); }
    #status.confirm, #status.needs_user, #status.stopped, #status.max_steps { border-left-color: var(--warn); background: var(--warn-soft); }
    #status.confirm strong, #status.needs_user strong, #status.stopped strong, #status.max_steps strong { color: var(--warn); }
    #status-msg { display: block; white-space: pre-wrap; margin-top: 3px; }
    #status.answered #status-msg { font-size: 13.5px; line-height: 1.55; }
    #status-meta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 7px; }
    #status-meta:empty { display: none; }
    #confirm { display: none; gap: 8px; margin-top: 10px; }
    #confirm.show { display: flex; }
    button.allow { background: var(--warn); border-color: var(--warn); color: #fff; }

    ol { margin: 10px 0 0; padding: 0; list-style: none; max-height: 250px; overflow: auto; display: grid; gap: 6px; }
    li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; display: grid; grid-template-columns: 22px 1fr; gap: 3px 6px; background: var(--bg); }
    li .n { width: 20px; height: 20px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
    li .what { font-weight: 600; overflow-wrap: anywhere; }
    li .meta { grid-column: 2; color: var(--muted); font-size: 11.5px; }
    li .chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
    li.fail { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); } li.fail .what { color: var(--bad); }
    .chip { font-size: 11px; padding: 0 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
    .chip.face { color: var(--face); } .chip.photo { color: var(--photo); } .chip.field { color: var(--field); } .chip.text { color: var(--text); }
    .chip.vision { color: var(--brand); } .chip.none { color: var(--muted); }

    footer { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
    footer button.link { font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div class="title">
      <h1>On-Device Perception Agent</h1>
      <div class="tag">Personal data stays on this device</div>
    </div>
    <div class="server"><span class="dot" id="dot"></span><span id="server">checking…</span></div>
  </header>

  <div class="body">
    <div id="page">…</div>

    <textarea id="task" placeholder="Tell the agent what to do, e.g. Fill the form with name John Doe and email john@example.com, then submit.&#10;&#10;Or ask about the page, e.g. What does this page ask for?"></textarea>
    <div id="hint"></div>

    <div class="row">
      <button class="primary" id="run" title="Work on the page. Questions are answered without touching the page.">Run task</button>
      <button id="ask" title="Only answer a question about this page. Never clicks or types.">Ask about page</button>
      <span class="spacer"></span>
      <button class="ghost" id="stop" disabled>Stop</button>
    </div>
    <div class="links">
      <button class="link" id="demo" title="Fill in the demo task for the test page">Demo task</button>
      <button class="link" id="demo-q" title="Fill in a demo question">Demo question</button>
      <button class="link" id="demo-info" title="Fill the form on this page with your saved details">Fill with my info</button>
    </div>
    <div class="warn" id="warn">This tab is not a normal web page. Chrome does not allow extensions on its own pages; open an http(s) site.</div>

    <div id="status">
      <strong id="status-title"></strong><span id="status-msg"></span><span id="status-meta"></span>
      <div id="confirm">
        <button class="allow" id="allow">Allow</button>
        <button id="deny">Don't allow</button>
      </div>
    </div>
    <ol id="steps"></ol>
  </div>

  <footer>
    <button class="link" id="info" title="Save your details once; the AI never sees the values">My info</button>
    <button class="link" id="seen">What the AI sees →</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
