<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>On-Device Perception Agent</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --soft: #f9fafb; --soft2: #f3f4f6;
      --brand: #2563eb; --brand-dark: #1d4ed8; --brand-soft: #eff6ff;
      --ok: #15803d; --ok-soft: #f0fdf4; --warn: #b45309; --warn-soft: #fffbeb; --bad: #dc2626; --bad-soft: #fef2f2;
      --face: #dc2626; --photo: #0e7490; --field: #7c3aed; --text: #b45309;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --fg: #f3f4f6; --muted: #9ca3af; --line: #262b34; --soft: #16191f; --soft2: #1d2129;
              --brand: #3b82f6; --brand-dark: #2563eb; --brand-soft: #16233d;
              --ok: #4ade80; --ok-soft: #12241a; --warn: #fbbf24; --warn-soft: #26200f; --bad: #f87171; --bad-soft: #2a1717;
              --face: #f87171; --photo: #22d3ee; --field: #a78bfa; --text: #fbbf24; }
    }
    * { box-sizing: border-box; }
    body { width: 410px; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }

    header { display: flex; align-items: center; gap: 11px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .mark { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--brand); color: #fff; }
    .mark svg { width: 19px; height: 19px; }
    .title { flex: 1; min-width: 0; }
    .title h1 { font-size: 14.5px; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
    .title .tag { font-size: 11.5px; color: var(--muted); }
    .server { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: #22c55e; }
    .dot.bad { background: #ef4444; }

    .body { padding: 13px 16px 14px; }
    #page { color: var(--muted); font-size: 11.5px; margin-bottom: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #page::before { content: "On this page · "; font-weight: 600; color: var(--fg); }

    textarea { width: 100%; min-height: 80px; resize: vertical; padding: 11px 12px; border: 1px solid var(--line); border-radius: 13px;
               background: var(--soft); color: var(--fg); font: inherit; font-size: 13.5px; transition: border-color .15s, box-shadow .15s, background .15s; }
    textarea:focus { outline: none; border-color: var(--brand); background: var(--bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
    #hint { color: var(--brand); font-size: 11.5px; margin-top: 6px; padding: 5px 9px; border-radius: 8px; background: var(--brand-soft); }
    #hint:empty { display: none; }

    .row { display: flex; gap: 8px; margin-top: 11px; align-items: center; }
    button { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
             transition: background .12s, border-color .12s; }
    button:hover:not(:disabled) { background: var(--soft2); }
    button.primary { border-color: var(--brand); color: #fff; background: var(--brand); }
    button.primary:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
    button.ghost { background: transparent; }
    button:disabled { opacity: .45; cursor: default; }
    .spacer { flex: 1; }
    .links { display: flex; gap: 6px; margin-top: 10px; font-size: 12px; white-space: nowrap; align-items: center; }
    .links button.link { padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-weight: 500; }
    .links button.link:hover { color: var(--brand); border-color: var(--brand); background: var(--bg); text-decoration: none; }
    button.link { border: none; background: none; color: var(--brand); padding: 0; font-weight: 600; }
    button.link:hover:not(:disabled) { background: none; text-decoration: underline; }
    .as { color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .as[hidden] { display: none; }
    .as select { font: inherit; font-size: 12px; max-width: 110px; padding: 2px 5px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); }

    .warn { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 8px 10px; font-size: 12px; margin-top: 9px; display: none; }
    .warn.show { display: block; }

    /* Status card */
    #status { position: relative; margin-top: 13px; padding: 12px 14px 12px 17px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); display: none; overflow: hidden; }
    #status.show { display: block; }
    #status::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c, var(--brand)); }
    #status strong { display: block; font-size: 13.5px; color: var(--c, var(--fg)); letter-spacing: -.005em; }
    #status.running { --c: var(--brand); }
    #status.running strong::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%;
      border: 2px solid var(--brand); border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.done { --c: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 28%, var(--line)); }
    #status.answered { --c: var(--brand); background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 25%, var(--line)); }
    #status.failed { --c: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 28%, var(--line)); }
    #status.confirm, #status.needs_user, #status.stopped, #status.max_steps { --c: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)); }
    #status-msg { display: block; white-space: pre-wrap; margin-top: 3px; overflow-wrap: anywhere; }
    #status.answered #status-msg { font-size: 13.5px; line-height: 1.6; }
    #status-meta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
    #status-meta:empty { display: none; }
    #confirm { display: none; gap: 8px; margin-top: 11px; }
    #confirm.show { display: flex; }
    button.allow { border-color: #d97706; color: #fff; background: #d97706; }
    button.allow:hover:not(:disabled) { background: #b45309; border-color: #b45309; }

    /* Steps, as a timeline */
    ol { margin: 12px 0 0; padding: 0 2px 0 0; list-style: none; max-height: 252px; overflow: auto; }
    li { position: relative; padding: 0 0 12px 32px; }
    li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
    li:last-child::before { display: none; }
    li .n { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; display: grid; place-items: center;
            color: var(--brand); background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); }
    li .what { display: block; font-weight: 600; overflow-wrap: anywhere; line-height: 22px; }
    li .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    li .meta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
    li.fail .n { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); } li.fail .what { color: var(--bad); }
    .chip { font-size: 11px; font-weight: 600; padding: 0 8px; border-radius: 99px; white-space: nowrap; color: var(--c);
            background: var(--bg); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); }
    .chip.face { --c: var(--face); } .chip.photo { --c: var(--photo); } .chip.field { --c: var(--field); } .chip.text { --c: var(--text); }
    .chip.vision { --c: var(--brand); } .chip.none { --c: var(--muted); }

    footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--soft); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div class="title">
      <h1>On-Device Perception Agent</h1>
      <div class="tag">Personal data stays on this device</div>
    </div>
    <div class="server"><span class="dot" id="dot"></span><span id="server">checking…</span></div>
  </header>

  <div class="body">
    <div id="page">…</div>

    <textarea id="task" placeholder="Tell the agent what to do, e.g. Fill the form with name John Doe and email john@example.com, then submit.&#10;&#10;Or ask about the page, e.g. What does this page ask for?"></textarea>
    <div id="hint"></div>

    <div class="row">
      <button class="primary" id="run" title="Work on the page. Questions are answered without touching the page.">Run task</button>
      <button id="ask" title="Only answer a question about this page. Never clicks or types.">Ask about page</button>
      <span class="spacer"></span>
      <button class="ghost" id="stop" disabled>Stop</button>
    </div>
    <div class="links">
      <button class="link" id="demo" title="Fill in the demo task for the test page">Demo task</button>
      <button class="link" id="demo-q" title="Fill in a demo question">Demo question</button>
      <button class="link" id="demo-info" title="Fill the form on this page with your saved details">Fill with my info</button>
      <span class="spacer"></span>
      <label class="as" id="as-row" hidden title="Whose saved details to use. A task that names a saved person uses that person instead.">as
        <select id="person"></select>
      </label>
    </div>
    <div class="warn" id="warn">This tab is not a normal web page. Chrome does not allow extensions on its own pages; open an http(s) site.</div>

    <div id="status">
      <strong id="status-title"></strong><span id="status-msg"></span><span id="status-meta"></span>
      <div id="confirm">
        <button class="allow" id="allow">Allow</button>
        <button id="deny">Don't allow</button>
      </div>
    </div>
    <ol id="steps"></ol>
  </div>

  <footer>
    <button class="link" id="info" title="Save your details once; the AI never sees the values">My info</button>
    <button class="link" id="seen">What the AI sees →</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
